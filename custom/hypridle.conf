$lock_cmd = hyprctl dispatch 'hl.dsp.global("quickshell:lock")' & pidof qs quickshell hyprlock || hyprlock
# $lock_cmd = pidof hyprlock || hyprlock
$suspend_cmd = systemctl suspend || loginctl suspend

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = loginctl lock-session
    # Official hypridle: dpms on + brightness restore. Do not remode/reload the
    # renderer here — nvidia-modeset ApplyModeSetConfig can hang Hyprland.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' ; brightnessctl -r ; hyprctl dispatch 'hl.dsp.global("quickshell:lockFocus")'
    inhibit_sleep = 3
}

listener {
    timeout = 300 # 5mins
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600 # 10mins
    on-timeout = brightnessctl -s && hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r
}

listener {
    timeout = 900 # 15mins
    on-timeout = $suspend_cmd
}
